plugins {
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
    id 'maven-publish'
}


subprojects {
	apply plugin: 'java-library'
	apply plugin: 'io.spring.dependency-management'
	apply plugin: 'maven-publish'
	apply plugin: 'signing'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	repositories {
		mavenLocal()
		maven {
			def githubRepositoryOwner = System.getenv("GITHUB_REPOSITORY_OWNER") ?: System.getenv("GITHUB_ACTOR")
			url = uri("https://maven.pkg.github.com/${githubRepositoryOwner}/rsocket-broker-client")
			credentials {
				username = project.findProperty("gpr.user") ?: githubRepositoryOwner
				password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
			}
		}
		mavenCentral()
		maven { url 'https://repo.spring.io/milestone' }
		if (version.endsWith('SNAPSHOT')) {
			maven { url 'https://repo.spring.io/snapshot' }
		}
	}

	dependencyManagement {
		imports {
			mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
		}

		dependencies {
			dependency "org.assertj:assertj-core:${assertjVersion}"
		}
	}

	dependencies {
		implementation platform("io.projectreactor:reactor-bom:${reactorBomVersion}")
		implementation platform("io.rsocket:rsocket-bom:${rsocketVersion}")
		implementation platform("org.junit:junit-bom:${junitJupiterVersion}")
		testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	}

	java {
		withSourcesJar()
		withJavadocJar()
	}
	publishing {
		publications {
			mavenJava(MavenPublication) {
				from components.java
			}
		}
	}

	test {
		useJUnitPlatform()
	}

}

apply from: "${rootDir}/gradle/publications.gradle"

description = 'RSocket Broker Client: client for RSocket Broker.'

wrapper {
	distributionType = Wrapper.DistributionType.ALL
}
